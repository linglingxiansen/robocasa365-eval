[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robocasa365-policy-evaluation"
version = "0.1.0"
description = "Portable Native12 policy evaluation for RoboCasa365"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["starVLA*", "deployment*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
